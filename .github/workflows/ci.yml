name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate marketplace.json
        run: jq . .claude-plugin/marketplace.json > /dev/null
      - name: Validate plugin.json
        run: jq . plugins/coe/.claude-plugin/plugin.json > /dev/null
      - name: Check all commands have frontmatter
        run: |
          for f in $(find plugins/coe/commands -name '*.md'); do
            head -1 "$f" | grep -q '^---$' || { echo "Missing frontmatter: $f"; exit 1; }
          done
      - name: Check all agents have frontmatter
        run: |
          for f in $(find plugins/coe/agents -name '*.md'); do
            head -1 "$f" | grep -q '^---$' || { echo "Missing frontmatter: $f"; exit 1; }
          done
      - name: Check all skills have frontmatter
        run: |
          for f in $(find plugins/coe/skills -name 'SKILL.md'); do
            head -1 "$f" | grep -q '^---$' || { echo "Missing frontmatter: $f"; exit 1; }
          done

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: 'plugins/coe/**/*.md README.md'
        continue-on-error: true  # advisory, not blocking, until rules settled

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck plugin scripts
        run: shellcheck plugins/coe/scripts/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run nudge test suite
        run: bash plugins/coe/scripts/test-coe-nudge.sh
